name: Android build
# Rebuild both APKs for each fix on feature/hotspot-real-state.

on:
  push:
    branches: [ "main", "feature/hotspot-real-state" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build both APKs
        run: gradle assembleDebug
      - name: Prepare easy-to-find APKs
        run: |
          mkdir -p dist
          cp client/build/outputs/apk/debug/client-debug.apk dist/ARGENTAS-Invitados.apk
          cp server/build/outputs/apk/debug/server-debug.apk dist/ARGENTAS-Control-Tablet.apk
      - name: Upload APKs (files at ZIP root)
        uses: actions/upload-artifact@v4
        with:
          name: ARGENTAS-APKs
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
